<!DOCTYPE html>
<html>

<head>
    <title>Pertemuan 2 - HTML Lanjutan</title>

    <style>
        button {
    background-color: #4a90e2;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
}
        button:hover {
    background-color: #357abd;
}
        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #555;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>PEMROGRAMAN WEB</h1>

        <h2>Pertemuan 2 - HTML Lanjutan</h2>

        <p id="pesan"></p>
            Saya sedang belajar HTML dan CSS.<button onclick="mulaiBelajar()">Mulai Belajar</button>
        </p>

    </div>

    <script>

    function mulaiBelajar() {
       document.getElementById("pesan").innerHTML =
        "Selamat! Kamu sudah mulai belajar JavaScript."; 
    }

</script>

</body>

</html>
